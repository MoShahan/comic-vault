name: Comic Vault - Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Expo production build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # Same install path EAS uses; fails when package.json and lockfile drift.
      - name: Install npm dependencies (npm ci)
        run: npm ci --include=dev

      - name: Expo doctor
        run: npx expo-doctor

      - name: Check Expo package versions
        run: npx expo install --check

      # Production Metro bundle — catches JS/asset export failures lint/tests miss.
      - name: Export Android production bundle
        run: npx expo export --platform android --output-dir dist-ci
